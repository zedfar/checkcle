<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#02c37e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#02c37e;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow accent left -->
  <rect x="0" y="0" width="500" height="630" fill="url(#glow)"/>

  <!-- Top border line green -->
  <rect x="0" y="0" width="1200" height="4" fill="#02c37e"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="157" x2="1200" y2="157" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="314" x2="1200" y2="314" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="472" x2="1200" y2="472" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Decorative uptime chart line (right side) -->
  <polyline points="700,480 750,420 800,430 850,360 900,370 950,310 1000,320 1050,260 1100,270 1150,220 1200,230"
    fill="none" stroke="#02c37e" stroke-width="3" stroke-opacity="0.4" stroke-linejoin="round"/>
  <polyline points="700,480 750,420 800,430 850,360 900,370 950,310 1000,320 1050,260 1100,270 1150,220 1200,230"
    fill="none" stroke="#02c37e" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Status dots -->
  <circle cx="820" cy="500" r="5" fill="#02c37e"/>
  <circle cx="860" cy="500" r="5" fill="#02c37e"/>
  <circle cx="900" cy="500" r="5" fill="#02c37e"/>
  <circle cx="940" cy="500" r="5" fill="#f59e0b"/>
  <circle cx="980" cy="500" r="5" fill="#02c37e"/>
  <circle cx="1020" cy="500" r="5" fill="#02c37e"/>
  <circle cx="1060" cy="500" r="5" fill="#ef4444"/>
  <circle cx="1100" cy="500" r="5" fill="#02c37e"/>
  <circle cx="1140" cy="500" r="5" fill="#02c37e"/>

  <!-- C logo mark -->
  <g transform="translate(90, 200)">
    <path d="M 90 0 C 40.29 0 0 40.29 0 90 C 0 139.71 40.29 180 90 180 C 113.4 180 134.55 171.04 150.3 156.2 L 133.2 141.2 C 122.4 152.4 107.1 159.5 90 159.5 C 51.58 159.5 20.5 128.42 20.5 90 C 20.5 51.58 51.58 20.5 90 20.5 C 107.1 20.5 122.4 27.6 133.2 38.8 L 150.3 23.8 C 134.55 8.96 113.4 0 90 0 Z" fill="#02c37e"/>
  </g>

  <!-- CheckCle text -->
  <text x="240" y="275" font-family="'Segoe UI', system-ui, sans-serif" font-size="86" font-weight="700" fill="#f1f5f9" letter-spacing="-2">CheckCle</text>

  <!-- MOD badge -->
  <rect x="240" y="300" width="120" height="38" rx="6" fill="#f59e0b"/>
  <text x="300" y="326" font-family="'Segoe UI', monospace, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="3">MOD</text>

  <!-- Tagline -->
  <text x="240" y="400" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" fill="#94a3b8" letter-spacing="0.5">Open-source monitoring platform</text>
  <text x="240" y="440" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" fill="#94a3b8" letter-spacing="0.5">with custom modifications</text>

  <!-- Bottom label -->
  <text x="240" y="565" font-family="'Segoe UI', monospace, sans-serif" font-size="18" fill="#02c37e" letter-spacing="1">checkcle.internal</text>
</svg>
